<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미림 박물관 - 홈</title>
  <link rel="stylesheet" href="mirim_museum_Home.css">
</head>
<body>
  <header class="navbar">
    <div class="top-left-logo">
      <img src="박물관1.png" alt="박물관 아이콘">
      <span>미림 박물관</span>
    </div>

    <nav class="nav-center">
      <button type="button" class="nav-link active">홈</button>
      <button type="button" class="nav-link">박물관</button>
      <button type="button" class="nav-link">랭킹</button>
    </nav>

    <div class="nav-right">
      <button type="button" class="btn-upload">+ 유물 올리기</button>
      <button type="button" class="user-badge">
        <span class="badge-circle">최</span>
        <span>1618 최강은</span>
      </button>
    </div>
  </header>

  <main class="home-container">
    <img src="박물관1.png" alt="박물관 아이콘" class="hero-icon">
    <h1 class="hero-title">
      미림에서의 사소한 추억을<br>
      미림 박물관에 전시해요
    </h1>
    <p class="hero-desc">
      내 물건이나 친구들과의 순간을 찍어 제목과 설명을 붙여 전시해보세요. 유물 화석 필터로<br>
      색다르게 남길 수 있어요.
    </p>

    <section class="action-section">
      <h2 class="section-label">무엇을 해볼까요?</h2>

      <div class="card-grid">
        <button type="button" class="action-card">
          <div class="card-top">
            <div class="card-icon-box">
              <img src="사진기.png" alt="사진기 아이콘">
            </div>
            <span class="card-arrow">→</span>
          </div>
          <div class="card-bottom">
            <strong class="card-title">유물 올리기</strong>
            <span class="card-sub">사진을 찍거나 골라서, 제목과 설명을 붙여 전시해요</span>
          </div>
        </button>

        <button type="button" class="action-card">
          <div class="card-top">
            <div class="card-icon-box">
              <img src="박물관1.png" alt="박물관 아이콘">
            </div>
            <span class="card-arrow">→</span>
          </div>
          <div class="card-bottom">
            <strong class="card-title">박물관 둘러보기</strong>
            <span class="card-sub">친구들이 전시한 유물과 화석을 감상하고 좋아요를 눌러요</span>
          </div>
        </button>
      </div>
    </section>
  </main>
</body>
</html>
