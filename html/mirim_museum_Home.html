<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미림 박물관 - 홈</title>
  <link rel="stylesheet" href="../css/mirim_museum_Home.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../js/supabase.js" defer></script>
  <script src="../js/home.js" defer></script>
</head>
<body>
  <header class="navbar">
    <a href="mirim_museum_Home.html" class="top-left-logo">
      <img src="../img/박물관1.png" alt="박물관 아이콘">
      <span>미림 박물관</span>
    </a>

    <nav class="nav-center">
      <a href="mirim_museum_Home.html" class="nav-link active">홈</a>
      <a href="gallery.html" class="nav-link">박물관</a>
      <a href="ranking.html" class="nav-link">랭킹</a>
    </nav>

    <div class="nav-right">
      <a href="new.html" class="btn-upload">+ 유물 올리기</a>
      <!-- 로그인한 사람 정보는 JS가 채워요 -->
      <button type="button" class="user-badge" id="profileButton">
        <span class="badge-circle" id="profileMark"></span>
        <span id="profileName"></span>
      </button>
    </div>
  </header>

  <main class="home-container">
    <img src="../img/박물관1.png" alt="박물관 아이콘" class="hero-icon">
    <h1 class="hero-title">
      미림에서의 사소한 추억을<br>
      미림 박물관에 전시해요
    </h1>
    <p class="hero-desc">
      내 물건이나 친구들과의 순간을 찍어 제목과 설명을 붙여 전시해보세요. 유물 화석 필터로<br>
      색다르게 남길 수 있어요.
    </p>

    <section class="action-section">
      <h2 class="section-label">무엇을 해볼까요?</h2>

      <!-- 카드 전체가 링크 (a 태그 하나가 카드 하나) -->
      <div class="card-grid">
        <a href="new.html" class="action-card">
          <div class="card-top">
            <div class="card-icon-box">
              <img src="../img/사진기.png" alt="사진기 아이콘">
            </div>
            <span class="card-arrow">→</span>
          </div>
          <div class="card-bottom">
            <strong class="card-title">유물 올리기</strong>
            <span class="card-sub">사진을 찍거나 골라서, 제목과 설명을 붙여 전시해요</span>
          </div>
        </a>

        <a href="gallery.html" class="action-card">
          <div class="card-top">
            <div class="card-icon-box">
              <img src="../img/박물관1.png" alt="박물관 아이콘">
            </div>
            <span class="card-arrow">→</span>
          </div>
          <div class="card-bottom">
            <strong class="card-title">박물관 둘러보기</strong>
            <span class="card-sub">친구들이 전시한 유물과 화석을 감상하고 좋아요를 눌러요</span>
          </div>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
