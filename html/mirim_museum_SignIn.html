<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미림 박물관 - 회원가입</title>
  <link rel="icon" type="image/png" href="../img/logo.png">
  <link rel="stylesheet" href="../css/mirim_museum_SignIn.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../js/supabase.js" defer></script>
  <script src="../js/signup.js" defer></script>
</head>
<body>

  <a href="mirim_museum.html" class="top-left-logo">
    <img src="../img/박물관1.png" alt="박물관 아이콘">
    <span>미림 박물관</span>
  </a>

  <main class="main-container">
    <img src="../img/박물관1.png" alt="박물관 아이콘" class="main-icon">
    <h1 class="main-title">미림 박물관</h1>
    <p class="sub-text">
      미림에서의 사소한 추억을<br>
      미림박물관에 저장해요
    </p>

    <form class="login-form" id="signupForm">
      <div class="input-group">
        <label for="user-id">학번</label>
        <input type="text" id="user-id" placeholder="예) 1405"
               inputmode="numeric" autocomplete="username" required>
      </div>

      <div class="input-group">
        <label for="user-pw">비밀번호</label>
        <input type="password" id="user-pw" placeholder="6자 이상"
               minlength="6" autocomplete="new-password" required>
      </div>

      <div class="input-group">
        <label for="user-name">이름</label>
        <input type="text" id="user-name" placeholder="예) 박경은"
               autocomplete="name" required>
      </div>

      <button type="submit" class="btn-submit" id="signupButton">가입하기 →</button>

      <p class="form-switch">
        이미 가입했어요? <a href="mirim_museum_LogIn.html">로그인</a>
      </p>
    </form>
  </main>
</body>
</html>
