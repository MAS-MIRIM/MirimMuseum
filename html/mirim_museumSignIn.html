<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미림 박물관 - 회원가입</title>
  <link rel="stylesheet" href="mirim_museum_SignIn.css">
</head>
<body>

  <header class="top-left-logo">
    <img src="박물관1.png" alt="박물관 아이콘">
    <span>미림 박물관</span>
  </header>

  
  <main class="main-container">
    <img src="박물관1.png" alt="박물관 아이콘" class="main-icon">
    <h1 class="main-title">미림 박물관</h1>
    <p class="sub-text">
      미림에서의 사소한 추억을<br>
      미림박물관에 저장해요
    </p>

    <form class="login-form">
      <div class="input-group">
        <label for="user-id">아이디</label>
        <input type="text" id="user-id" placeholder="예) mirim1234">
      </div>

      <div class="input-group">
        <label for="user-pw">비밀번호</label>
        <input type="password" id="user-pw" placeholder="예) 1234">
      </div>

      <div class="input-group">
        <label for="user-nickname">닉네임</label>
        <input type="text" id="user-nickname" placeholder="예) 강우니">
      </div>

      <button type="button" class="btn-submit">가입하기 →</button>
    </form>
  </main>
</body>
</html>
